spring:
  application:
    name: client-ledger-backend

  datasource:
    # Defaults match docker-compose.yaml so a local stack works without extra configuration.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:client-ledger}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping agrees with it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    # Migrations live in db/migration and run before Hibernate validates the mapping, so a fresh
    # database is brought up to date on boot. Shares DB_SCHEMA with hibernate.default_schema above
    # so Flyway cannot migrate one schema while Hibernate validates another.
    default-schema: ${DB_SCHEMA:public}
    # Leave false: an existing database with tables but no flyway_schema_history should fail
    # loudly rather than silently baselining over whatever is already there.
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  mail:
    # SMTP server emails to clients are sent through, such as smtp.gmail.com or smtp.office365.com.
    # Credentials come only from the environment; for Gmail and Microsoft 365 use an app password.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:jatin.marwaha@gmail.com}
    password: ${MAIL_PASSWORD:oufsyalaubwcpuqa}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          # Milliseconds; keeps a slow or unreachable server from holding a request open.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}

client-ledger:
  # Zone whose calendar decides "today" for billing, such as which services are due for the ledger.
  business-time-zone: ${BUSINESS_TIME_ZONE:Asia/Kolkata}

  notification:
    # Address emails are sent from; must be one the SMTP account may send as. Defaults to its username.
    from: ${MAIL_FROM:${MAIL_USERNAME:jatin.marwaha@gmail.com}}
    # Name shown beside the from address; the firm's name from Global Settings when left empty.
    from-name: ${MAIL_FROM_NAME:Jatin Marwaha}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Off by default so an unreachable SMTP server does not mark the service down for its probes.
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.psc.cl: ${LOG_LEVEL:INFO}
