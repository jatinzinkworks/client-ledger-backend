        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: financialYear
        in: query
        description: "Indian financial year of the statement, written as yyyy-yy.\
          \ Omit for every year the client has been one, together"
        required: false
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The PDF, as an attachment; a year with no entries gives zero\
            \ totals"
          headers:
            Content-Disposition:
              description: "attachment, with the statement's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Rohan_Mehta_Ledger_FY2026-27.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: "financialYear is not a year such as 2026-27, or the identifier\
            \ is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/ledger-status:
    get:
      tags:
      - Ledger
      summary: "Show a client's balance for every financial year, or for one"
      description: "Returns, for every Indian financial year (1 April to 31 March)\
        \ since the client became one, latest first, or only for the financialYear\
        \ given: what was billed before discount, the discount given, what was received,\
        \ the closing balance (billed less discount less received) and a status. The\
        \ current year runs to date and is PENDING while it has an amount owing; a\
        \ closed year that ended with an amount owing is CARRIED; a year with nothing\
        \ owing is SETTLED, as is one where more was received than billed, whose closing\
        \ balance is then negative. Charges count in the year they fell due and payments\
        \ in the year they were received; each year stands alone, so an earlier year's\
        \ balance is not brought into the next. The first year is that of the client's\
        \ earliest ledger entry, or of the day they were added if earlier; years with\
        \ no entries are listed with zeros. clientSince and yearCount always cover\
        \ every year since then, whichever years are listed. Each year also carries\
        \ the same figures for each company with entries in it; with pendingOnly,\
        \ only the companies still owing for the year (a closing balance above zero)\
        \ are listed, while the year's own figures and companyCount still cover every\
        \ company."
      operationId: clientLedgerStatus
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: financialYear
        in: query
        description: "Only list this Indian financial year, written as yyyy-yy. Omit\
          \ to list every year since the client became one"
        required: false
        schema:
          type: string
        example: 2025-26
      - name: pendingOnly
        in: query
        description: "List, in each year, only the companies still owing for it. The\
          \ year's own figures still cover every company"
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: "The client's years, latest first, or the one year asked for"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientLedgerStatusResponse"
        "400":
          description: "The identifier is not a valid UUID, financialYear is not a\
            \ year such as 2026-27, or pendingOnly is not true or false"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/ledger-export:
    get:
      tags:
      - Ledger
      summary: Export a client's ledger for a financial year as an Excel workbook
      description: "Downloads an .xlsx workbook for the client and one Indian financial\
        \ year (1 April to 31 March), named after both, such as Rohan_Mehta_Ledger_FY2026-27.xlsx.\
        \ Its Summary sheet holds the figures of the client's ledger summary for the\
        \ year; its Ledger sheet lists every service charge and payment of the year\
        \ across all of the client's companies, earliest first, with charges as debits,\
        \ payments as credits, a running balance, and a totals row. One sheet per\
        \ company follows, by company name, listing only that company's entries with\
        \ its own running balance and totals; a company with no entries in the year\
        \ gets headings and zero totals. Above its entries, each company sheet shows\
        \ the company's opening balance and the date it stood at, whatever the year\
        \ it falls in, or None; it is counted in the balances only when dated in the\
        \ year exported, as an opening balance entry. As in the summary, charges count\
        \ in the year they fell due and payments in the year they were received, and\
        \ each balance starts from zero."
      operationId: exportClient
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: financialYear
        in: query
        description: "Indian financial year to export, written as yyyy-yy"
        required: true
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The workbook, as an attachment; a year with no entries gives\
            \ zero totals and an empty ledger"
          headers:
            Content-Disposition:
              description: "attachment, with the workbook's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Rohan_Mehta_Ledger_FY2026-27.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: "financialYear is missing or is not a year such as 2026-27,\
            \ or the identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/ledger-entries:
    get:
      tags:
      - Ledger
      summary: List the ledger entries of a client
      description: "Returns the ledger entries posted for any company of the client,\
        \ earliest due first unless sortBy and sortDirection choose another order.\
        \ Each entry carries the companyId it was billed to. Narrow them to a range\
        \ of due dates with fromDate and toDate, either of which may be left open,\
        \ and to an Indian financial year with financialYear; given together, only\
        \ entries matching both are returned. Entries are returned a page at a time;\
        \ the summary totals every matching entry across all pages, not just the page\
        \ returned."
      operationId: listClientEntries
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: fromDate
        in: query
        description: Only return entries due on or after this date (ISO yyyy-MM-dd).
          Omit to leave the range open at the start
        required: false
        schema:
          type: string
          format: date
        example: 2026-04-01
      - name: toDate
        in: query
        description: Only return entries due on or before this date (ISO yyyy-MM-dd).
          Omit to leave the range open at the end
        required: false
        schema:
          type: string
          format: date
        example: 2027-03-31
      - name: financialYear
        in: query
        description: "Only return entries whose due date falls in this Indian financial\
          \ year (1 April to 31 March), written as yyyy-yy. Omit to return entries\
          \ of every year"
        required: false
        schema:
          type: string
        example: 2026-27
      - name: page
        in: query
        description: "Page to return, counting from 0. A page past the last returns\
          \ no entries"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: "Largest number of entries a page holds, from 1 to 200"
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 50
      - name: sortBy
        in: query
        description: "Field to sort entries by: dueDate, entryDate, serviceName or\
          \ totalAmount. Entries alike in that field follow in due date, then service\
          \ name, order, which keeps pages stable"
        required: false
        schema:
          type: string
          default: dueDate
          enum:
          - dueDate
          - entryDate
          - serviceName
          - totalAmount
      - name: sortDirection
        in: query
        description: Whether sortBy ascends (asc) or descends (desc); either case
          is accepted
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      responses:
        "200":
          description: "A page of the client's ledger entries, with the totals of\
            \ every matching entry, broken down by financial year and by company;\
            \ no entries and zero totals when none matches"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerListResponse"
        "400":
          description: "The identifier is not a valid UUID, a date is not a valid\
            \ ISO date, fromDate is after toDate, financialYear is not a year such\
            \ as 2026-27, page is negative, size is outside 1 to 200, or sortBy or\
            \ sortDirection is not one of the values listed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/ledger-summary:
    get:
      tags:
      - Ledger
      summary: Summarise a company's account for a financial year
      description: "Returns, for one company of the client and one Indian financial\
        \ year (1 April to 31 March): the total billed, the total payment received,\
        \ what is pending (billed less received), the total discount given, and the\
        \ date and amount of the last payment. Service charges count in the year they\
        \ fell due, and payments in the year they were received; a payment is not\
        \ matched to particular charges, so a payment settling an earlier year's charges\
        \ reduces the pending amount of the year it was received in."
      operationId: summarizeCompany
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: financialYear
        in: query
        description: "Indian financial year to summarise, written as yyyy-yy"
        required: true
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The year's summary; every amount zero, and no lastPayment,\
            \ when the year has no entries"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyLedgerSummaryResponse"
        "400":
          description: "financialYear is missing or is not a year such as 2026-27,\
            \ or an identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/ledger-summary-pdf:
    get:
      tags:
      - Notifications
      summary: Download the ledger summary of one of a client's companies as a PDF
      description: "Downloads the PDF ledger statement that emailing the client the\
        \ ledger summary of one of their companies attaches, without sending anything,\
        \ every page headed by the firm's logo and its name from Global Settings.\
        \ With financialYear, it covers that Indian financial year (1 April to 31\
        \ March); for the current year it is exactly the PDF the email attaches. Without\
        \ it, it covers every year as one period, from the year the client was added\
        \ (or of the company's earliest entry, if earlier) to the current year: the\
        \ summary is across the whole span, so the amount pending is what the company\
        \ owes overall, and the details list every entry since it was taken on with\
        \ a running balance. Either way it opens with the company's summary, then\
        \ its charges and payments, every charge as one total fee and every payment\
        \ as the amount paid, with no discount shown. The file is named after the\
        \ company and the year, such as Mehta_Textiles_Pvt_Ltd_Ledger_FY2026-27.pdf,\
        \ or Mehta_Textiles_Pvt_Ltd_Ledger_All_Years.pdf for every year."
      operationId: downloadLedgerSummaryPdf
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: financialYear
        in: query
        description: "Indian financial year of the statement, written as yyyy-yy.\
          \ Omit for every year together"
        required: false
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The PDF, as an attachment; a period with no entries gives\
            \ zero totals"
          headers:
            Content-Disposition:
              description: "attachment, with the statement's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Mehta_Textiles_Pvt_Ltd_Ledger_FY2026-27.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: "financialYear is not a year such as 2026-27, or an identifier\
            \ is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/ledger-export:
    get:
      tags:
