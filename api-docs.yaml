            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/services:
    get:
      tags:
      - Client Services
      summary: List the services of a company
      description: "Returns every service assigned to one company of the client, most\
        \ recent delivery first. The list is returned whole; it is not paged. Given\
        \ a financialYear, each service also carries what it was billed in that year\
        \ (totalBilled): the sum of its service charges in the ledger falling due\
        \ in the year, GST included, or zero when none did. Without one, those fields\
        \ are left out."
      operationId: listServices_1
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: financialYear
        in: query
        description: "Indian financial year (1 April to 31 March), written as yyyy-yy,\
          \ to add each service's billed amount for. Omit to leave it out"
        required: false
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The company's services, empty when none has been assigned"
