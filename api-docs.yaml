          type: number
          description: "Billed less received in the year, across every company; negative\
            \ when the year's payments exceed its billing"
          example: 24235.0
        totalDiscount:
          type: number
          description: "Sum of the discounts taken off the service fees billed in\
            \ the year, across every company"
          example: 3000.0
        lastPayment:
          $ref: "#/components/schemas/LastPayment"
          description: "The most recent payment received in the year from any company,\
            \ naming the company; absent when none was received"
    LastPayment:
      type: object
