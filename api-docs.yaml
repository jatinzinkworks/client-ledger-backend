    ClientRequest:
      type: object
      description: "Client to add, with the companies they hold"
      properties:
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
          maxLength: 100
          minLength: 0
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
          maxLength: 20
          minLength: 0
          pattern: "^[+]?[0-9 ()-]{6,20}$"
        email:
          type: string
          format: email
          description: Contact email address
          example: rohan.mehta@example.com
          maxLength: 254
          minLength: 0
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager from the Manager Catalog who looks
            after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        discountPercent:
          type: number
          default: "0.00"
          description: "Discount granted to the client, as a percentage. Also applied\
            \ to every company that does not set its own"
          example: 10.0
          maximum: 100.00
          minimum: 0.00
        companies:
          type: array
          description: Companies the client owns or acts for
          items:
            $ref: "#/components/schemas/CompanyRequest"
          maxItems: 50
          minItems: 0
      required:
      - companies
      - email
      - firstName
      - lastName
      - managerId
      - phone
    CompanyRequest:
      type: object
      description: "Company owned by, or acted for on behalf of, the client"
      properties:
        companyName:
          type: string
          description: Registered name of the company
          example: Mehta Textiles Pvt Ltd
          maxLength: 200
          minLength: 0
        companyType:
          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
        address:
          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
          maxLength: 500
          minLength: 0
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage.\
            \ When omitted, the company takes the client's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
      required:
      - address
      - companyName
      - companyType
    ServiceAssignmentRequest:
      type: object
      description: Catalog service to deliver to the company
      properties:
        serviceId:
          type: string
          format: uuid
          description: Identifier of the service in the Service Catalog
          example: 3b8e5f21-9c4d-4a17-8e62-1f0d7a9c5b34
        deliveryDate:
          type: string
          format: date
          description: "Date the service is, or was, delivered"
          example: 2026-10-15
        discountPercent:
          type: number
          description: "Discount granted on this service, as a percentage. When omitted,\
            \ the service takes the company's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        comment:
          type: string
          description: Free-text note about this delivery
          example: Filing for September 2026
          maxLength: 1000
          minLength: 0
      required:
      - deliveryDate
      - serviceId
