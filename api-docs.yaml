          example: 15
          maximum: 365
          minimum: 1
        markOverdueAfterDays:
          type: integer
          format: int32
          default: 60
          description: Days after the payment due date before an unpaid invoice is
            marked overdue
          example: 60
          maximum: 365
          minimum: 1
        paymentReminderEnabled:
          type: boolean
          default: false
          description: Whether payment reminders are sent for outstanding invoices
          example: true
        paymentReminderDays:
          type: integer
          format: int32
          description: "Days before the due date on which a reminder is sent. Required\
            \ when paymentReminderEnabled is true, ignored otherwise"
          example: 7
          maximum: 365
          minimum: 1
    PaymentTermsResponse:
      type: object
      description: Payment terms currently held under Global Settings
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the payment terms record
          example: 3f2a6c1e-8b4d-4a91-9f0c-2d5e7a1b3c4d
        paymentDueAfterDays:
          type: integer
          format: int32
          description: Days after work completion before payment becomes due
          example: 15
        markOverdueAfterDays:
          type: integer
          format: int32
          description: Days after the payment due date before an unpaid invoice is
            marked overdue
          example: 60
        paymentReminderEnabled:
          type: boolean
          description: Whether payment reminders are sent for outstanding invoices
          example: true
        paymentReminderDays:
          type: integer
          format: int32
          description: Days before the due date on which a reminder is sent. Absent
            when reminders are disabled
          example: 7
        createdAt:
          type: string
          format: date-time
          description: When the record was created
          example: 2026-09-29T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the record was last updated
          example: 2026-09-29T10:15:30Z
    FirmDetailsRequest:
      type: object
      description: Firm details to store under Global Settings
      properties:
        firmName:
          type: string
          description: "Registered name of the firm, as printed on invoices"
          example: Pranay Singhal & Company
          maxLength: 200
          minLength: 0
        gstin:
          type: string
          description: Goods and Services Tax Identification Number
          example: 27AAKFP4471M1ZS
          minLength: 1
          pattern: "^[0-9]{2}[A-Za-z]{5}[0-9]{4}[A-Za-z][1-9A-Za-z][Zz][0-9A-Za-z]$"
        firmRegistrationNo:
          type: string
          description: Firm registration number issued by the regulating body
          example: FRN 0148290W
          maxLength: 50
          minLength: 0
        email:
          type: string
          format: email
          description: Contact email address printed on invoices
          example: accounts@pranaysinghal.in
          maxLength: 254
          minLength: 0
        phone:
          type: string
          description: Contact phone number printed on invoices
          example: +91 22 4012 8890
          maxLength: 30
          minLength: 0
          pattern: "^[+]?[0-9 ()-]{6,30}$"
        address:
          type: string
          description: Postal address printed on invoices
          example: "302, Hubtown Solaris, N.S. Phadke Marg, Andheri East, Mumbai 400069"
          maxLength: 500
          minLength: 0
      required:
      - address
      - firmName
      - gstin
    FirmDetailsResponse:
      type: object
      description: Firm details currently held under Global Settings
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the firm details record
          example: 7c1d9f42-5a3b-4e88-9b21-6f0e8d4a2c17
        firmName:
          type: string
          description: Registered name of the firm
          example: Pranay Singhal & Company
        gstin:
          type: string
          description: Goods and Services Tax Identification Number
          example: 27AAKFP4471M1ZS
        firmRegistrationNo:
          type: string
          description: Firm registration number
          example: FRN 0148290W
        email:
          type: string
          description: Contact email address
          example: accounts@pranaysinghal.in
        phone:
          type: string
          description: Contact phone number
          example: +91 22 4012 8890
        address:
          type: string
          description: Postal address
          example: "302, Hubtown Solaris, N.S. Phadke Marg, Andheri East, Mumbai 400069"
        createdAt:
          type: string
          format: date-time
          description: When the record was created
          example: 2026-09-29T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the record was last updated
          example: 2026-09-29T10:15:30Z
    ClientRequest:
      type: object
      description: "Client to add, with the companies they hold"
      properties:
        clientId:
          type: string
          description: "The firm's own identifier for the client: PSC- followed by\
            \ 5 digits, held by no other client. GET /clients/next-client-id suggests\
            \ the next free one. It cannot be changed once the client is added"
          example: PSC-00001
          minLength: 1
          pattern: "^PSC-[0-9]{5}$"
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
          maxLength: 100
          minLength: 0
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
          maxLength: 20
          minLength: 0
          pattern: "^[+]?[0-9 ()-]{6,20}$"
        email:
          type: string
          format: email
          description: Contact email address
          example: rohan.mehta@example.com
          maxLength: 254
          minLength: 0
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager from the Manager Catalog who looks
            after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        birthday:
          type: string
          format: date
          description: Date of birth of the client; not after today. Optional
          example: 1985-07-23
        discountPercent:
          type: number
          default: "0.00"
          description: "Discount granted to the client, as a percentage. Also applied\
            \ to every company that does not set its own"
          example: 10.0
          maximum: 100.00
          minimum: 0.00
        companies:
          type: array
          description: "Companies the client owns or acts for, each with any balance\
            \ it is taken on with"
          items:
            $ref: "#/components/schemas/NewCompanyRequest"
          maxItems: 50
          minItems: 0
      required:
      - clientId
      - companies
      - email
      - firstName
      - lastName
      - managerId
      - phone
    NewCompanyRequest:
      type: object
      description: "Company owned by, or acted for on behalf of, a client being added,\
        \ with the balance it is taken on with"
      properties:
        companyName:
          type: string
          description: Registered name of the company
          example: Mehta Textiles Pvt Ltd
          maxLength: 200
          minLength: 0
        companyType:
          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
        address:
          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
          maxLength: 500
          minLength: 0
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage.\
            \ When omitted, the company takes the client's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        openingBalance:
          type: number
          description: "The balance the company is taken on with, brought over from\
            \ before: positive when the company owes it, negative when it starts in\
            \ credit, such as an advance. It is recorded in the company's ledger as\
            \ an opening balance, counted in what is pending but not as billed. Omit,\
            \ or send 0, for none"
          example: 25000.0
        openingBalanceDate:
          type: string
          format: date
          description: "The date the opening balance stood at, which places it in\
            \ a financial year; not after today. Only with an openingBalance. Defaults\
            \ to the day the client is added"
          example: 2026-03-31
      required:
      - address
      - companyName
      - companyType
    LedgerSummaryEmailResponse:
      type: object
      description: Confirms a ledger summary email was sent
      properties:
        clientId:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        companyId:
          type: string
          format: uuid
          description: Identifier of the company summarised. Absent when the summary
