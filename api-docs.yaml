        \ a running balance, and a totals row. Above its entries, the Ledger sheet\
        \ shows the company's opening balance and the date it stood at, whatever the\
        \ year it falls in, or None; it is counted in the balance only when dated\
        \ in the year exported, as an opening balance entry. As in the summary, charges\
        \ count in the year they fell due and payments in the year they were received,\
