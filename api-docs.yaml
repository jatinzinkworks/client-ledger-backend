      properties:
        serviceFee:
          type: number
          description: "Fee for the service, before discount and excluding GST"
          example: 5000.0
          minimum: 0.00
        discountPercent:
          type: number
          description: "Discount granted on the service, as a percentage"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        gstRatePercent:
          type: number
          description: "GST rate to charge, as a percentage"
