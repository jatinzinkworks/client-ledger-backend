            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Ledger
      summary: Post due services to a company's ledger
      description: "Creates a ledger entry for every service of the company that has\
        \ fallen due on or before today. Each entry takes the service fee from the\
        \ Service Catalog, takes off the discount granted on the service, and adds\
        \ GST at the service's rate; every figure is stored separately. A recurring\
        \ service is billed once for each date it fell due and has not been billed\
        \ for, then moves on to its next due date after today. A ONE_OFF service is\
        \ billed once and never again. Posting again when nothing new is due creates\
        \ nothing."
      operationId: postDueServices
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company to bill
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      responses:
        "200":
          description: "The entries created, earliest due first; empty when nothing\
            \ was due"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntryResponse"
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/import:
    post:
      tags:
      - Clients
      summary: Import clients and their companies from an Excel workbook
      description: "Imports a filled-in import template (GET /clients/import/template),\
        \ matching clients by their Client ID, ignoring case. A Client ID no client\
        \ holds yet creates the client, with the companies the Companies sheet links\
        \ to it, as POST /clients would. A Client ID a client already holds adds the\
        \ companies linked to it to that client, as POST /clients/{id}/companies would,\
        \ leaving the client's own details as they are; such a client need not be\
        \ on the Clients sheet. The import is all or nothing: every row is checked\
        \ first, and if any cell is missing or invalid, nothing is created and each\
        \ cell at fault is listed under errors, by reference such as Clients!F3. Managers\
        \ are named by their full name in the Manager Catalog. Up to 500 clients may\
        \ be listed at once; each new client needs 1 to 50 companies, and no client\
        \ may hold more than 50 in all. Importing the same workbook twice does not\
        \ create its clients twice, but adds their companies again. The response lists\
        \ each client created or added to, and each company created with the opening\
        \ balance recorded for it, and counts and adds those balances up per client\
        \ and overall, so they can be checked against the workbook."
      operationId: importClients
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The filled-in client import workbook (.xlsx)
              required:
              - file
      responses:
        "201":
          description: "Every new client and every company was created, with the opening\
            \ balances recorded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientImportResponse"
        "400":
          description: "No file was attached, or the file is not an .xlsx workbook,\
            \ lacks the Clients or Companies sheet or its headings, holds no clients\
            \ or too many, or has invalid cells; code SPREADSHEET_INVALID lists each\
            \ cell at fault under errors. Nothing was created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: A manager or a client was deleted while the import ran; nothing
            was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Another import or request added a client under one of the\
            \ workbook's Client IDs, or companies to one of its clients, while the\
            \ import ran; nothing was created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The file is larger than the server accepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/services/import/template:
    get:
      tags:
      - Service Catalog
      summary: Download the service catalog import template
      description: "Returns the Excel workbook to fill in for POST /services/import.\
        \ Its Services sheet takes one row per service: Service Name, Description,\
        \ Category, Billing Frequency, Standard Fee, GST %, Invoice Day, Invoice Month\
        \ of Quarter and Invoice Month. An Instructions sheet describes every column\
        \ with an example, and which schedule columns each billing frequency needs."
      operationId: downloadTemplate
      responses:
        "200":
          description: "The template, as an attachment"
          headers:
            Content-Disposition:
              description: "attachment, with the template's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Service_Catalog_Import_Template.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/services/categories:
    get:
      tags:
      - Service Catalog
      summary: List service categories
      description: "Returns every category a service can belong to, in their declared\
        \ order. These are the values accepted for a service's category."
      operationId: listCategories
      responses:
        "200":
          description: Every service category
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Practice area a service belongs to
                  enum:
                  - COMPLIANCE
                  - TAX
                  - AUDIT
                  - ACCOUNTING
                  - ADVISORY
                  - CERTIFICATION
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/overview:
    get:
      tags:
      - Overview
      summary: Show the firm's position for a financial year
      description: "Returns, across every client and one Indian financial year (1\
        \ April to 31 March): the total billed, the total payment received, what is\
        \ pending (billed less received) and the total discount given, worked out\
        \ as each client's ledger summary does. Charges count in the year they fell\
        \ due and payments in the year they were received; earlier years' balances\
        \ are not brought forward. Also returns how many clients, companies and assigned\
        \ services there are now. previousToDate gives the same figures for the previous\
        \ year up to the same point in it (today a year earlier while the year is\
        \ running, the whole previous year once it is over), so this year to date\
        \ compares fairly with last."
      operationId: overview
      parameters:
      - name: financialYear
        in: query
        description: "Indian financial year to total, written as yyyy-yy"
        required: true
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: The overview; every amount zero when the year has no ledger
            entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "400":
          description: financialYear is missing or is not a year such as 2026-27
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/overview/top-pending-managers:
    get:
      tags:
      - Overview
      summary: Rank the managers whose clients owe most
      description: "Returns the managers whose clients still owe, most first, with\
        \ what those clients were billed and paid and what remains pending (billed\
        \ less received) across all of them, and how many clients each manager has.\
        \ Clients count towards the manager they are assigned to now, including their\
        \ history from before. Given a financialYear, only charges falling due and\
        \ payments received in that year count; without one, every year to date counts,\
        \ as in each manager's totalPending. Managers whose clients are settled or\
        \ in credit overall are left out; those owing the same are ranked in identifier\
        \ order."
      operationId: topPendingManagers
      parameters:
      - name: financialYear
        in: query
        description: "Indian financial year to rank by, written as yyyy-yy. Omit to\
          \ rank by every year to date"
        required: false
        schema:
          type: string
        example: 2026-27
      - name: limit
        in: query
        description: "Most managers to return, from 1 to 50"
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      responses:
        "200":
          description: The ranking; no managers when nobody owes anything
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopPendingManagersResponse"
        "400":
          description: "financialYear is not a year such as 2026-27, or limit is not\
            \ a whole number from 1 to 50"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
