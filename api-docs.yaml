      summary: Export a client's ledger for a financial year as an Excel workbook
      description: "Downloads an .xlsx workbook for the client and one Indian financial\
        \ year (1 April to 31 March), named after both, such as Rohan_Mehta_Ledger_FY2026-27.xlsx.\
        \ Its Summary sheet holds the figures of the client's ledger summary for the\
        \ year; its Ledger sheet lists every service charge and payment of the year\
        \ across all of the client's companies, earliest first, with charges as debits,\
        \ payments as credits, a running balance, and a totals row. One sheet per\
        \ company follows, by company name, listing only that company's entries with\
        \ its own running balance and totals; a company with no entries in the year\
        \ gets headings and zero totals. As in the summary, charges count in the year\
        \ they fell due and payments in the year they were received, and each balance\
        \ starts from zero."
