          example: 2026-04-01
        toDate:
          type: string
          format: date
          description: "Last day of the financial year, 31 March"
          example: 2027-03-31
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the year, across\
            \ every company"
          example: 67260.0
        totalPaymentReceived:
          type: number
          description: "Sum of the payments received in the year from every company,\
            \ as a positive number"
          example: 43025.0
