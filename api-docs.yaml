openapi: 3.1.0
info:
  title: Client Ledger API
  description: REST API for the PSC Client Ledger backend service.
  contact:
    name: PSC Client Ledger Team
  version: v1
servers:
- url: /
  description: Default server
tags:
- name: Overview
  description: The firm's position across every client
- name: Global Settings
  description: "Tenant-wide configuration for the Client Ledger, such as payment terms"
- name: Client Services
  description: Services from the Service Catalog delivered to a client's companies
- name: Clients
  description: People the firm works for and the manager who looks after them
- name: Service Catalog
  description: "Billable services the firm offers, with their fees and billing schedules"
- name: Client Companies
  description: "Companies owned by, or acted for on behalf of, a client"
- name: Manager Catalog
  description: "Staff who can be assigned to client work, with their roles and contact\
    \ details"
- name: Notifications
  description: "Emails sent to clients about their accounts, and the PDF they attach"
- name: Ledger
  description: Amounts client companies owe for the services delivered to them
- name: Birthdays
  description: "Clients' birthdays, to greet them on the day"
paths:
  /psc/cl/v1/services/{id}:
    get:
      tags:
      - Service Catalog
      summary: Fetch a service
      description: Returns one service by its identifier.
      operationId: getService
      parameters:
      - name: id
        in: path
        description: Identifier of the service
        required: true
        schema:
          type: string
          format: uuid
        example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
      responses:
        "200":
          description: Service found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceResponse"
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No service carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Service Catalog
      summary: Update a service
      description: "Replaces a service wholesale, so omitted fields are cleared rather\
        \ than left untouched. The same invoice schedule rules as create apply. The\
        \ subscriber count cannot be changed through this endpoint."
      operationId: updateService
      parameters:
      - name: id
        in: path
        description: Identifier of the service
        required: true
        schema:
          type: string
          format: uuid
        example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
      requestBody:
        description: New content for the service
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogServiceRequest"
        required: true
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No service carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another service already uses this name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Service Catalog
      summary: Delete a service
      description: Removes a service from the catalog. A service that companies still
        subscribe to cannot be deleted and is rejected with 409.
      operationId: deleteService
      parameters:
      - name: id
        in: path
        description: Identifier of the service
        required: true
        schema:
          type: string
          format: uuid
        example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
      responses:
        "204":
          description: Service deleted
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No service carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Companies still subscribe to the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/services/fees:
    put:
      tags:
      - Service Catalog
      summary: Update the standard fees of several services
      description: "Changes the standard fee of each service named, in one go, and\
        \ nothing else about them. The update is all or nothing: if any service is\
        \ unknown, or one is named twice, no fee changes. Up to 200 services may be\
        \ changed at once. Charges already posted to the ledger keep the fee they\
        \ were posted with; services due afterwards are billed at the new fee."
      operationId: updateFees
      requestBody:
        description: The new standard fee of each service to change
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceFeeBulkUpdateRequest"
        required: true
      responses:
        "200":
          description: "Fees updated; the updated services, in the order the request\
            \ named them"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogServiceResponse"
        "400":
          description: "Request body failed validation, such as a missing or negative\
            \ fee or an empty list, or a service is named more than once"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: One or more identifiers name no service; the message lists
            each
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/managers/{id}:
    get:
      tags:
      - Manager Catalog
      summary: Fetch a manager
      description: "Returns one manager by identifier, with the clients assigned to\
        \ them, as the client list shows them, how many there are, and what they still\
        \ owe in total."
      operationId: getManager
      parameters:
      - name: id
        in: path
        description: Identifier of the manager
        required: true
        schema:
          type: string
          format: uuid
        example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
      responses:
        "200":
          description: Manager found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerResponse"
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No manager carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Manager Catalog
      summary: Update a manager
      description: "Replaces a manager wholesale. Every field is mandatory, so nothing\
        \ is left behind from the previous version."
      operationId: updateManager
      parameters:
      - name: id
        in: path
        description: Identifier of the manager
        required: true
        schema:
          type: string
          format: uuid
        example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
      requestBody:
        description: New content for the manager
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerRequest"
        required: true
      responses:
        "200":
          description: Manager updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No manager carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another manager already holds this email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Manager Catalog
      summary: Delete a manager
      description: Removes a manager from the catalog. A manager who still has clients
        assigned cannot be deleted; reassign those clients first.
      operationId: deleteManager
      parameters:
      - name: id
        in: path
        description: Identifier of the manager
        required: true
        schema:
          type: string
          format: uuid
        example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
      responses:
        "204":
          description: Manager deleted
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No manager carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Clients are still assigned to the manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{id}:
    get:
      tags:
      - Clients
      summary: Fetch a client
      description: "Returns one client by identifier, with their client id, their\
        \ companies in full and the name of the manager who looks after them."
      operationId: getClient
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      responses:
        "200":
          description: Client found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Clients
      summary: Update a client
      description: "Replaces a client's own fields wholesale. The client's companies\
        \ are left as they are; add or delete them through the company endpoints.\
        \ The client id cannot be changed, so it is not part of the payload. An omitted\
        \ client discount resets to zero. Companies without a discount of their own\
        \ take the new client discount."
      operationId: updateClient
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      requestBody:
        description: "New content for the client, excluding their companies"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
        required: true
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "400":
          description: "Request body failed validation, or the identifier is not a\
            \ valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the assigned manager\
            \ does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Clients
      summary: Delete a client
      description: "Removes a client together with their companies. A client with\
        \ services assigned to any of their companies cannot be deleted; remove those\
        \ services first. Nor can a client with payments or service charges in the\
        \ ledger of any company: a ledger is a financial record and is never deleted\
        \ along with its client. Opening balances alone do not stop it; they are deleted\
        \ with the client."
      operationId: deleteClient
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      responses:
        "204":
          description: Client deleted
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Services are still assigned to, or payments or service charges\
            \ recorded against, one or more of the client's companies; the message\
            \ says which"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{id}/companies/{companyId}:
    get:
      tags:
      - Client Companies
      summary: Fetch a company of a client
      description: Returns one company of the client. A company that exists but belongs
        to a different client is reported as not found.
      operationId: getCompany
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      responses:
        "200":
          description: Company found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Client Companies
      summary: Update a company of a client
      description: "Replaces one company of the client wholesale; it keeps its identifier.\
        \ Every field except the discount and the opening balance is mandatory, and\
        \ an omitted discount gives the company the client's. The opening balance,\
        \ a ledger entry, is kept when omitted: send 0 to remove it, or another amount\
        \ to record it, or replace the one the company has, keeping its date unless\
        \ openingBalanceDate is given. A company that exists but belongs to a different\
        \ client is reported as not found."
      operationId: updateCompany
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      requestBody:
        description: New content for the company
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: Company updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: "Request body failed validation, such as an openingBalanceDate\
            \ without an openingBalance other than 0, or an openingBalanceDate after\
            \ today; or an identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Client Companies
      summary: Delete a company of a client
      description: "Removes one company of the client. A client must keep at least\
        \ one company, so their only company cannot be deleted; delete the client\
        \ instead. A company with services assigned cannot be deleted; remove those\
        \ services first. Nor can a company with payments or service charges in its\
        \ ledger: a ledger is a financial record and is never deleted along with its\
        \ company. An opening balance alone does not stop it; it is deleted with the\
        \ company."
      operationId: deleteCompany
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      responses:
        "204":
          description: Company deleted
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "It is the client's only company (BUSINESS_RULE_VIOLATION),\
            \ or services are still assigned to it or payments or service charges\
            \ recorded against it (RESOURCE_IN_USE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/services/{assignmentId}:
    get:
      tags:
      - Client Services
      summary: Fetch a service of a company
      description: Returns one service assigned to a company of the client.
      operationId: getService_1
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: assignmentId
        in: path
        description: Identifier of the assigned service
        required: true
        schema:
          type: string
          format: uuid
        example: 9d2a7c40-6e1b-4f53-b8a9-0c3e5d7f1a62
      responses:
        "200":
          description: Assigned service found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAssignmentResponse"
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or the company holds no such assigned service"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Client Services
      summary: Update a service of a company
      description: "Replaces the delivery date, discount and comment of a service\
        \ assigned to a company of the client. The catalog service itself cannot change;\
        \ remove this assignment and assign the other service instead. An omitted\
        \ discount resets to the company's, and an omitted comment is cleared. The\
        \ service type and next due date are worked out again from the catalog service's\
        \ current schedule."
      operationId: updateService_1
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: assignmentId
        in: path
        description: Identifier of the assigned service
        required: true
        schema:
          type: string
          format: uuid
        example: 9d2a7c40-6e1b-4f53-b8a9-0c3e5d7f1a62
      requestBody:
        description: New details for the assigned service
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAssignmentUpdateRequest"
        required: true
      responses:
        "200":
          description: Assigned service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAssignmentResponse"
        "400":
          description: "Request body failed validation, or an identifier is not a\
            \ valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or the company holds no such assigned service"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Client Services
      summary: Remove a service from a company
      description: "Removes one assigned service from a company of the client. When\
        \ it was the company's last assignment of that service, the company no longer\
        \ counts towards the catalog service's usedByCompanies."
      operationId: removeService
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: assignmentId
        in: path
        description: Identifier of the assigned service
        required: true
        schema:
          type: string
          format: uuid
        example: 9d2a7c40-6e1b-4f53-b8a9-0c3e5d7f1a62
      responses:
        "204":
          description: Assigned service removed
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or the company holds no such assigned service"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/payments/{paymentId}:
    put:
      tags:
      - Ledger
      summary: Update a payment received from a company
      description: "Replaces every detail of a payment recorded for one company of\
        \ the client: the amount, the date received, the method, the reference and\
        \ the comment. An omitted reference or comment is cleared. The amount is given\
        \ as a positive number and stored as negative; the financial year follows\
        \ the new date received, which cannot be after today. When the payment was\
        \ recorded (entryDate) does not change. paymentId is the ledger entry id the\
        \ payment was recorded under."
      operationId: updatePayment
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company that paid
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: paymentId
        in: path
        description: Identifier of the payment's ledger entry
        required: true
        schema:
          type: string
          format: uuid
        example: 5e7c1a93-2b4d-4f86-9a0e-8d3b6c2f1e47
      requestBody:
        description: The payment's corrected details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
        required: true
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryResponse"
        "400":
          description: "Request body failed validation, dateReceived is after today,\
            \ or an identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or no such ledger entry belongs to the company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "The ledger entry is a service charge or an opening balance,\
            \ not a payment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/ledger-entries/{entryId}:
    get:
      tags:
      - Ledger
      summary: Fetch a ledger entry of a company
      description: "Returns one ledger entry billed to a company of the client, with\
        \ every financial figure stored for it."
      operationId: getEntry
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: entryId
        in: path
        description: Identifier of the ledger entry
        required: true
        schema:
          type: string
          format: uuid
        example: 5e7c1a93-2b4d-4f86-9a0e-8d3b6c2f1e47
      responses:
        "200":
          description: Ledger entry found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryResponse"
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or no such ledger entry was billed to the company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Ledger
      summary: Correct the rates of a ledger entry
      description: "Replaces the service fee, discount and GST rate of one ledger\
        \ entry billed to a company of the client. The discount, taxable, GST and\
        \ total amounts are worked out again from them, rounded the same way as when\
        \ entries are posted, so the figures always add up. What the entry bills,\
        \ its due date, financial year and entry date cannot change. Only service\
        \ charges have rates; update a payment through its payment endpoint instead.\
        \ An opening balance cannot be changed; delete it if it is wrong."
      operationId: updateEntry
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: entryId
        in: path
        description: Identifier of the ledger entry
        required: true
        schema:
          type: string
          format: uuid
        example: 5e7c1a93-2b4d-4f86-9a0e-8d3b6c2f1e47
      requestBody:
        description: Corrected rates for the ledger entry
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryUpdateRequest"
        required: true
      responses:
        "200":
          description: Ledger entry corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryResponse"
        "400":
          description: "Request body failed validation, or an identifier is not a\
            \ valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or no such ledger entry was billed to the company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "The ledger entry is a payment or an opening balance, which\
            \ have no rates"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Ledger
      summary: Delete a ledger entry
      description: "Deletes one ledger entry of a company of the client: a payment\
        \ recorded in error, or a service charge. For a service charge, the service\
        \ it billed is left as it is: a ONE_OFF service stays marked as posted, and\
        \ a recurring service keeps its next due date, so posting again does not bill\
        \ the deleted date a second time."
      operationId: deleteEntry
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: entryId
        in: path
        description: Identifier of the ledger entry
        required: true
        schema:
          type: string
          format: uuid
        example: 5e7c1a93-2b4d-4f86-9a0e-8d3b6c2f1e47
      responses:
        "204":
          description: Ledger entry deleted
        "400":
          description: An identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or no such ledger entry was billed to the company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/manager:
    put:
      tags:
      - Clients
      summary: Assign several clients to a manager
      description: "Assigns every client named to one manager, in one go, and changes\
        \ nothing else about them. The update is all or nothing: if the manager or\
        \ any client is unknown, no client is reassigned. A client named more than\
        \ once is assigned once. Up to 200 clients may be assigned at once."
      operationId: updateManager_1
      requestBody:
        description: The manager and the clients to assign to them
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientManagerBulkUpdateRequest"
        required: true
      responses:
        "200":
          description: "Clients reassigned; the updated clients, in the order the\
            \ request first named them"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummaryResponse"
        "400":
          description: "Request body failed validation, such as a missing manager\
            \ or an empty client list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "The manager does not exist, or one or more identifiers name\
            \ no client; the message lists each"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/services:
    get:
      tags:
      - Service Catalog
      summary: List services
      description: "Returns every service in the catalog, ordered by name. The list\
        \ is returned whole; it is not paged. Each service also carries what it was\
        \ billed across every client (totalBilled): the sum of its service charges\
        \ in the ledger, GST included, or zero when there are none. Given a financialYear,\
        \ only charges falling due in that year count, and financialYear is echoed\
        \ back; without one, every charge due to date counts."
      operationId: listServices
      parameters:
      - name: financialYear
        in: query
        description: "Indian financial year (1 April to 31 March), written as yyyy-yy,\
          \ to total each service's billed amount for. Omit to total every year to\
          \ date"
        required: false
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The catalog, empty when nothing has been added yet"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogServiceResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Service Catalog
      summary: Create a service
      description: "Adds a service to the catalog. The invoice schedule must match\
        \ the billing frequency: ONE_OFF carries no schedule, MONTHLY needs a day\
        \ of month, QUARTERLY needs a month of quarter plus a day of month, and ANNUAL\
        \ needs a month plus a day of month. The GST rate defaults to 18 percent when\
        \ omitted. Service names are unique across the catalog, ignoring case."
      operationId: createService
      requestBody:
        description: Service to add to the catalog
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogServiceRequest"
        required: true
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServiceResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A service with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/services/import:
    post:
      tags:
      - Service Catalog
      summary: Import services into the catalog from an Excel workbook
      description: "Creates every service on a filled-in import template (GET /services/import/template),\
        \ as POST /services would. The import is all or nothing: every row is checked\
        \ first, and if any cell is missing or invalid, or a name is already in the\
        \ catalog or repeated on the sheet, nothing is created and each cell at fault\
        \ is listed under errors, by reference such as Services!G3. Names are compared\
        \ ignoring case. The invoice schedule columns must match the billing frequency,\
        \ as on create. Up to 500 services may be imported at once."
      operationId: importServices
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The filled-in service catalog import workbook (.xlsx)
              required:
              - file
      responses:
        "201":
          description: Every service was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCatalogImportResponse"
        "400":
          description: "No file was attached, or the file is not an .xlsx workbook,\
            \ lacks the Services sheet or its headings, holds no services or too many,\
            \ or has invalid cells; code SPREADSHEET_INVALID lists each cell at fault\
            \ under errors. Nothing was created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A service of the same name was added while the import ran;
            nothing was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The file is larger than the server accepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/notifications/payment-reminders:
    post:
      tags:
      - Notifications
      summary: Email a payment reminder to every client with an amount pending
      description: "Takes no input. Emails every client who owes something across\
        \ every financial year (billed less received across all of their companies,\
        \ to date, is more than zero) an individual payment reminder for that whole\
        \ amount, under the subject \"Payment reminder\". It carries the same details\
        \ as the ledger summary email for the current Indian financial year: billed,\
        \ received, the last payment and each company's figures, with the year's PDF\
        \ ledger statement attached; when earlier years left a balance, it is shown\
        \ alongside the year's so the figures add up to the amount asked for. It goes\
        \ to the client, copying in their manager. Clients settled or in credit overall\
        \ are skipped. Each client is emailed on its own, so one that fails is listed\
        \ under failures and the others are still reminded. The response returns once\
        \ every client has been tried."
      operationId: sendPaymentReminders
      responses:
        "200":
          description: "The run's outcome, including any clients that could not be\
            \ reminded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReminderResponse"
        "502":
          description: Email is not configured; no client was emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/notifications/ledger-summary-emails:
    post:
      tags:
      - Notifications
      summary: Email every client their ledger summary
      description: "Takes no input. Emails every client, one after another, their\
        \ ledger summary for the current Indian financial year across all of their\
        \ companies, exactly as emailing one client does: to the client, copying in\
        \ their manager, with the year's PDF ledger statement attached. Each client\
        \ is emailed on its own, so one that fails is listed under failures and the\
        \ others are still emailed. Clients with nothing billed or received in the\
        \ year are emailed too. The response returns once every client has been tried,\
        \ so it takes longer the more clients there are."
      operationId: sendAllClientLedgerSummaries
      responses:
        "200":
          description: "The run's outcome, including any clients that could not be\
            \ emailed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLedgerSummaryEmailResponse"
        "502":
          description: Email is not configured; no client was emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/managers:
    get:
      tags:
      - Manager Catalog
      summary: List managers
      description: "Returns every manager, ordered by last name then first name. The\
        \ list is returned whole; it is not paged."
      operationId: listManagers
      responses:
        "200":
          description: "The catalog, empty when nobody has been added yet"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagerResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Manager Catalog
      summary: Create a manager
      description: "Adds a manager to the catalog. Every field is mandatory, and the\
        \ email address must be unique across the catalog, ignoring case."
      operationId: createManager
      requestBody:
        description: Manager to add to the catalog
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagerRequest"
        required: true
      responses:
        "201":
          description: Manager created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A manager already holds this email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/ledger-entries/post-due:
    post:
      tags:
      - Ledger
      summary: Post due services to the ledgers of every company
      description: "Takes no input. Goes through every company of every client and\
        \ posts its due services to its ledger, exactly as posting for one company\
        \ does: every service fallen due on or before today and not yet billed is\
        \ billed once. Each company is posted on its own, so a failure for one is\
        \ listed under failures and the others are still posted. Running it again\
        \ when nothing new is due creates nothing."
      operationId: postAllDueServices
      responses:
        "200":
          description: "The run's outcome, including any companies that failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPostingResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/global-settings/payment-terms:
    get:
      tags:
      - Global Settings
      summary: Fetch payment terms
      description: Returns the tenant-wide payment terms currently in force. Responds
        with 404 until they have been created.
      operationId: getPaymentTerms
      responses:
        "200":
          description: Payment terms found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentTermsResponse"
        "404":
          description: No payment terms have been configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Global Settings
      summary: Create or update payment terms
      description: "Stores the tenant-wide payment terms. Payment terms are a singleton\
        \ setting, so this endpoint creates them on the first call (201) and overwrites\
        \ them on every subsequent call (200) — there is no separate update endpoint.\
        \ Any omitted field falls back to its default: payment due 15 days after completion,\
        \ overdue 60 days after the due date, and reminders disabled. Note that an\
        \ update replaces the record wholesale, so omitted fields are reset to their\
        \ defaults rather than left untouched."
      operationId: savePaymentTerms
      requestBody:
        description: Payment terms to store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentTermsRequest"
        required: true
      responses:
        "200":
          description: Existing payment terms updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentTermsResponse"
        "201":
          description: Payment terms created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentTermsResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A concurrent save conflicted; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/global-settings/firm-details:
    get:
      tags:
      - Global Settings
      summary: Fetch firm details
      description: Returns the firm details currently in force. Responds with 404
        until they have been created.
      operationId: getFirmDetails
      responses:
        "200":
          description: Firm details found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmDetailsResponse"
        "404":
          description: No firm details have been configured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Global Settings
      summary: Create or update firm details
      description: "Stores the firm details printed on invoices and Excel exports.\
        \ Firm details are a singleton setting, so this endpoint creates them on the\
        \ first call (201) and overwrites them on every subsequent call (200) - there\
        \ is no separate update endpoint. firmName, gstin and address are mandatory;\
        \ a save replaces the record wholesale, so omitted fields are cleared rather\
        \ than left untouched."
      operationId: saveFirmDetails
      requestBody:
        description: Firm details to store
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmDetailsRequest"
        required: true
      responses:
        "200":
          description: Existing firm details updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmDetailsResponse"
        "201":
          description: Firm details created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmDetailsResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A concurrent save conflicted; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients:
    get:
      tags:
      - Clients
      summary: List clients
      description: "Returns every client, or only the clients of one manager when\
        \ managerId is given, ordered by last name then first name. Each entry carries\
        \ the client's client id and names the client's companies only; fetch a client\
        \ by id for the full company details. Each entry also carries what the client\
        \ still owes (totalPending): everything billed to all of their companies less\
        \ every payment received, across all financial years. The list is returned\
        \ whole; it is not paged."
      operationId: listClients
      parameters:
      - name: managerId
        in: query
        description: Only return clients assigned to this manager. Omit to return
          every client. An unknown manager returns an empty list
        required: false
        schema:
          type: string
          format: uuid
        example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
      responses:
        "200":
          description: "The matching clients, empty when there are none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummaryResponse"
        "400":
          description: managerId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Clients
      summary: Create a client
      description: "Adds a client together with the companies they hold. Every field\
        \ is mandatory, at least one company must be supplied, and the assigned manager\
        \ must already exist in the Manager Catalog. The clientId is the firm's own\
        \ identifier for the client, PSC- followed by 5 digits: no other client may\
        \ hold it, and it cannot be changed afterwards. GET /clients/next-client-id\
        \ suggests the next free one. A company may bring an opening balance: what\
        \ it owed (positive) or was owed (negative) when taken on, dated openingBalanceDate\
        \ or the day the client is added. It is recorded in the company's ledger as\
        \ an OPENING_BALANCE entry, counted in what is pending but not as billed.\
        \ Nothing is created when any of it cannot be."
      operationId: createClient
      requestBody:
        description: "Client to add, with their companies"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
        required: true
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "400":
          description: "Request body failed validation, such as an openingBalanceDate\
            \ without an openingBalance, or an openingBalanceDate after today"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The assigned manager does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another client already holds the clientId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{id}/companies:
    get:
      tags:
      - Client Companies
      summary: List the companies of a client
      description: "Returns every company the client holds, in full, ordered by company\
        \ name, each with the number of services assigned to it. Given a financialYear,\
        \ each company also carries what it was billed (totalBilled), what it paid\
        \ (totalPaymentReceived) and what is pending in that year, from the ledger:\
        \ charges count in the year they fell due and payments in the year they were\
        \ received, and a company with no activity in the year shows zeros. Without\
        \ one, those fields are left out."
      operationId: listCompanies
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: financialYear
        in: query
        description: "Indian financial year (1 April to 31 March), written as yyyy-yy,\
          \ to add each company's billed, received and pending amounts for. Omit to\
          \ leave them out"
        required: false
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: The client's companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: "The identifier is not a valid UUID, or financialYear is not\
            \ a year such as 2026-27"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Client Companies
      summary: Add a company to a client
      description: "Adds one company to an existing client. Every field except the\
        \ discount and the opening balance is mandatory, and a company without a discount\
        \ of its own takes the client's. A company may bring an opening balance: what\
        \ it owes as it is taken on, brought over from before, dated openingBalanceDate\
        \ or the day it is added. It is recorded in the company's ledger. A client\
        \ holds at most 50 companies."
      operationId: addCompany
      parameters:
      - name: id
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      requestBody:
        description: Company to add to the client
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "201":
          description: Company added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        "400":
          description: "Request body failed validation, such as an openingBalanceDate\
            \ without an openingBalance, or an openingBalanceDate after today; or\
            \ the identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The client already holds the most companies allowed (BUSINESS_RULE_VIOLATION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/ledger-summary-email:
    post:
      tags:
      - Notifications
      summary: Email a client the ledger summary across all of their companies
      description: "Emails the client a summary of their ledger for the current Indian\
        \ financial year (1 April to 31 March) across all of their companies together:\
        \ what was billed, the what was received, what is pending and the last payment,\
        \ followed by each company's billed, received and pending amounts. The year's\
        \ ledger statement is attached as a PDF: the summary with a line per company,\
        \ then each company's charges and payments on a page of its own, every charge\
        \ as one total fee and every payment as the amount paid, with no discount\
        \ shown. It goes to the client's email address, copying in their manager,\
        \ from the address set in MAIL_FROM; replies go to the firm's email from Global\
        \ Settings when one is saved. The email is sent before the response returns."
      operationId: sendClientLedgerSummary
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      responses:
        "200":
          description: The email was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerSummaryEmailResponse"
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Email is not configured, or the mail server refused the email\
