          type: string
          description: Financial year the billing figures below cover. Only returned
            when listing a client's companies for a financial year
          example: 2026-27
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the financial year:\
            \ taxable amounts plus GST. Only returned when listing for a financial\
            \ year"
          example: 39235.0
        openingBalance:
          type: number
          description: "The opening balance the company was taken on with, when dated\
            \ in the financial year: positive when owed, negative when in credit;\
            \ zero otherwise. Only returned when listing for a financial year; see\
            \ openingBalanceAmount for the balance whatever its year"
          example: 0.0
        totalPaymentReceived:
          type: number
          description: "Sum of the payments received in the financial year, as a positive\
            \ number. Only returned when listing for a financial year"
          example: 15605.0
        pending:
          type: number
          description: Billed plus opening balance less received in the financial
            year; negative when more was received. Only returned when listing for
