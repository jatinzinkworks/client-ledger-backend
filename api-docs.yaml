  /psc/cl/v1/clients/{clientId}/ledger-status:
    get:
      tags:
      - Ledger
      summary: Show a client's balance for every financial year
      description: "Returns, for every Indian financial year (1 April to 31 March)\
        \ since the client became one, latest first: what was billed before discount,\
        \ the discount given, what was received, the closing balance (billed less\
        \ discount less received) and a status. The current year runs to date and\
        \ is PENDING while it has an amount owing; a closed year that ended with an\
        \ amount owing is CARRIED; a year with nothing owing is SETTLED, as is one\
        \ where more was received than billed, whose closing balance is then negative.\
        \ Charges count in the year they fell due and payments in the year they were\
        \ received; each year stands alone, so an earlier year's balance is not brought\
        \ into the next. The first year is that of the client's earliest ledger entry,\
        \ or of the day they were added if earlier; years with no entries are listed\
        \ with zeros. Each year also carries the same figures for each company with\
        \ entries in it."
      operationId: clientLedgerStatus
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      responses:
        "200":
          description: "The client's years, latest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientLedgerStatusResponse"
        "400":
          description: The identifier is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No client carries this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
