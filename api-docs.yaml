          example: 2026-03-31
    OverviewResponse:
      type: object
      description: The firm's position for one financial year across every client
      properties:
        financialYear:
          type: string
          description: Indian financial year (1 April to 31 March) the amounts cover
          example: 2026-27
        fromDate:
          type: string
          format: date
          description: First day of the financial year
          example: 2026-04-01
        toDate:
          type: string
          format: date
          description: Last day of the financial year
          example: 2027-03-31
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the year across\
            \ every client: taxable amounts plus GST, after discount"
          example: 1845000.0
        openingBalance:
          type: number
          description: "Sum of the opening balances dated in the year, which companies\
            \ were taken on with: positive when owed, negative when in credit. Not\
            \ part of totalBilled"
          example: 0.0
        totalPaymentReceived:
          type: number
          description: Sum of the payments received in the year across every client
          example: 1571500.0
        pending:
          type: number
          description: Billed plus opening balance less received in the year; negative
            when more was received. Earlier years' balances are not brought forward
          example: 273500.0
        totalDiscount:
          type: number
          description: Sum of the discounts given on the year's service charges
          example: 63500.0
        previousToDate:
          $ref: "#/components/schemas/PeriodTotals"
          description: "The same figures for the previous financial year, up to the\
            \ same point in it: the same day a year earlier while the requested year\
            \ is running, its whole year once the requested year is over. For comparing\
            \ this year to date with last year to date"
        totalClients:
          type: integer
          format: int64
          description: "Number of clients, as of now"
          example: 42
        totalCompanies:
          type: integer
          format: int64
          description: "Number of companies across every client, as of now"
          example: 97
        totalServices:
          type: integer
          format: int64
          description: "Number of services assigned across every company of every\
            \ client, as of now"
          example: 268
    PeriodTotals:
      type: object
      description: "The firm's figures over part of a financial year, for comparison"
      properties:
        financialYear:
          type: string
          description: Indian financial year the period falls in
          example: 2025-26
        fromDate:
          type: string
          format: date
          description: "First day of the period: the first day of the financial year"
          example: 2025-04-01
        toDate:
          type: string
          format: date
          description: Last day of the period
          example: 2025-10-14
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the period: taxable\
            \ amounts plus GST, after discount"
          example: 1647000.0
        openingBalance:
          type: number
          description: "Sum of the opening balances dated in the period: positive\
            \ when owed, negative when in credit. Not part of totalBilled"
          example: 0.0
        totalPaymentReceived:
          type: number
          description: Sum of the payments received in the period
          example: 1402000.0
        pending:
          type: number
          description: Billed plus opening balance less received in the period; negative
            when more was received
          example: 245000.0
        totalDiscount:
          type: number
          description: Sum of the discounts given on the period's service charges
          example: 58000.0
