    CompanyRequest:
      type: object
      description: "Company owned by, or acted for on behalf of, the client"
      properties:
        companyName:
          type: string
          description: Registered name of the company
          example: Mehta Textiles Pvt Ltd
          maxLength: 200
          minLength: 0
        companyType:
          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
        address:
          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
          maxLength: 500
          minLength: 0
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage.\
            \ When omitted, the company takes the client's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        openingBalance:
          type: number
          description: "The balance the company is taken on with, brought over from\
            \ before: positive when the company owes it, negative when it starts in\
            \ credit, such as an advance. It is recorded in the company's ledger as\
            \ an opening balance, counted in what is pending but not as billed. When\
            \ adding a company, omit it, or send 0, for none. When updating one, omit\
            \ it to leave the company's opening balance as it is, send 0 to remove\
            \ it, or send another amount to record it, or replace the one the company\
            \ has"
          example: 25000.0
        openingBalanceDate:
          type: string
          format: date
          description: "The date the opening balance stood at, which places it in\
            \ a financial year; not after today. Only with an openingBalance other\
            \ than 0. Defaults to the day the company is added, or, when updating\
            \ a company that has an opening balance, to that balance's date"
          example: 2026-03-31
      required:
      - address
      - companyName
      - companyType
