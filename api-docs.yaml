        financialYear:
          type: string
          description: "Indian financial year summarised: the current one"
          example: 2026-27
        to:
          type: string
          description: "Address the email was sent to: the client's"
          example: rohan.mehta@example.com
        cc:
          type: array
          description: "Addresses copied in: the client's manager"
          items:
            type: string
            example: pranay.singhal@example.com
        subject:
          type: string
          description: Subject of the email
          example: "Your ledger summary for Mehta Textiles Pvt Ltd, FY 2026-27"
        attachmentName:
          type: string
          description: Name of the PDF ledger statement attached
          example: Mehta_Textiles_Pvt_Ltd_Ledger_FY2026-27.pdf
        sentAt:
          type: string
          format: date-time
          description: When the email was handed to the SMTP server
          example: 2026-10-14T05:30:00Z
    ServiceAssignmentRequest:
      type: object
