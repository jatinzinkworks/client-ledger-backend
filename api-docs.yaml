        \ in the year, earliest first, with charges as debits, payments as credits,\
        \ a running balance, and a totals row. As in the summary, charges count in\
        \ the year they fell due and payments in the year they were received, and\
        \ the balance starts from zero."
      operationId: exportCompany
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: financialYear
        in: query
        description: "Indian financial year to export, written as yyyy-yy"
        required: true
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The workbook, as an attachment; a year with no entries gives\
            \ zero totals and an empty ledger"
          headers:
            Content-Disposition:
              description: "attachment, with the workbook's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Mehta_Textiles_Pvt_Ltd_Ledger_FY2026-27.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: "financialYear is missing or is not a year such as 2026-27,\
            \ or an identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CatalogServiceRequest:
      type: object
      description: Service to add to the catalog
      properties:
        serviceName:
          type: string
          description: "Name of the service, unique across the catalog"
          example: GST Monthly Return Filing
          maxLength: 150
          minLength: 0
        description:
          type: string
          description: What the service covers
          example: Preparation and filing of GSTR-1 and GSTR-3B each month
          maxLength: 1000
          minLength: 0
        category:
          type: string
          description: Practice area the service belongs to
          enum:
          - COMPLIANCE
          - TAX
          - AUDIT
          - ACCOUNTING
          - ADVISORY
          example: COMPLIANCE
        billingFrequency:
          type: string
          description: How often the service is billed
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        standardFee:
          type: number
          description: "Standard fee charged for the service, excluding GST"
          example: 5000.0
          minimum: 0.00
        gstRatePercent:
          type: number
          default: "18.00"
          description: "GST rate applied to the fee, as a percentage"
          example: 18.0
          maximum: 100.00
          minimum: 0.00
        invoiceSchedule:
          $ref: "#/components/schemas/InvoiceSchedule"
          description: When invoices are raised. Omit entirely for ONE_OFF billing
      required:
      - billingFrequency
      - category
      - serviceName
      - standardFee
    InvoiceSchedule:
      type: object
      description: When invoices are raised for a recurring service
      properties:
        dayOfMonth:
          type: integer
          format: int32
          description: "Day of the month the invoice is raised. In months shorter\
            \ than this day, the invoice falls on the last day of that month instead"
          example: 7
          maximum: 31
          minimum: 1
        monthOfQuarter:
          type: string
          description: "Quarterly billing only: which month after the quarter closes\
            \ the invoice is raised in"
          enum:
          - FIRST_MONTH
          - SECOND_MONTH
          - THIRD_MONTH
          example: FIRST_MONTH
        month:
          type: string
          description: "Annual billing only: the month the invoice is raised in, by\
            \ name"
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          example: APRIL
    CatalogServiceResponse:
      type: object
      description: A service held in the catalog
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the service
          example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
        serviceName:
          type: string
          description: Name of the service
          example: GST Monthly Return Filing
        description:
          type: string
          description: What the service covers
          example: Preparation and filing of GSTR-1 and GSTR-3B each month
        category:
          type: string
          description: Practice area the service belongs to
          enum:
          - COMPLIANCE
          - TAX
          - AUDIT
          - ACCOUNTING
          - ADVISORY
          example: COMPLIANCE
        billingFrequency:
          type: string
          description: How often the service is billed
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        standardFee:
          type: number
          description: "Standard fee charged for the service, excluding GST"
          example: 5000.0
        gstRatePercent:
          type: number
          description: "GST rate applied to the fee, as a percentage"
          example: 18.0
        invoiceSchedule:
          $ref: "#/components/schemas/InvoiceSchedule"
          description: When invoices are raised. Absent for ONE_OFF billing
        usedByCompanies:
          type: integer
          format: int32
          description: How many companies currently subscribe to this service. Read
            only
          example: 12
          readOnly: true
        financialYear:
          type: string
          description: Financial year totalBilled covers. Only returned when listing
            the catalog for a financial year; absent when totalBilled covers every
            year to date
          example: 2026-27
          readOnly: true
        totalBilled:
          type: number
          description: "Sum of this service's charges across every client, taxable\
            \ amounts plus GST: those falling due in financialYear when listing for\
            \ one, otherwise every charge due to date. Zero when nothing fell due.\
            \ Only returned when listing the catalog"
          example: 39235.0
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the service was created
          example: 2026-10-01T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the service was last updated
          example: 2026-10-01T10:15:30Z
    ErrorResponse:
      type: object
      description: Standard error payload
      properties:
        timestamp:
          type: string
          format: date-time
          description: Moment the error was produced
          example: 2026-09-29T10:15:30Z
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
        code:
          type: string
          description: "Short, machine-friendly error code"
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human readable summary of what went wrong
          example: One or more fields are invalid
        path:
          type: string
          description: Request path that produced the error
          example: /psc/cl/v1/global-settings/payment-terms
        errors:
          type: array
          description: "Field level validation failures, present only for validation\
            \ errors"
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      description: A single field level validation failure
      properties:
        field:
          type: string
          description: Name of the offending field
          example: markOverdueAfterDays
        message:
          type: string
          description: Why the value was rejected
          example: must be greater than or equal to 1
    ServiceFeeBulkUpdateRequest:
      type: object
      description: New standard fees for several services
      properties:
        updates:
          type: array
          description: "The new fee of each service to change, each service at most\
            \ once"
          items:
            $ref: "#/components/schemas/ServiceFeeUpdate"
          maxItems: 200
          minItems: 0
      required:
      - updates
    ServiceFeeUpdate:
      type: object
      description: New standard fee for one service
      properties:
        serviceId:
          type: string
          format: uuid
          description: Identifier of the service in the catalog
          example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
        standardFee:
          type: number
          description: "New standard fee charged for the service, excluding GST"
          example: 5500.0
          minimum: 0.00
      required:
      - serviceId
      - standardFee
    ManagerRequest:
      type: object
      description: Manager to store in the catalog
      properties:
        firstName:
          type: string
          description: Given name of the manager
          example: Pranay
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          description: Family name of the manager
          example: Singhal
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          description: "Work email address, unique across the catalog"
          example: pranay.singhal@pranaysinghal.in
          maxLength: 254
          minLength: 0
        role:
          type: string
          description: Seniority the manager holds
          enum:
          - SENIOR_MANAGER
          - MANAGER
          - ASSOCIATE
          example: SENIOR_MANAGER
        mobileNumber:
          type: string
          description: Mobile contact number
          example: +91 98765 43210
          maxLength: 20
          minLength: 0
          pattern: "^[+]?[0-9 ()-]{6,20}$"
      required:
      - email
      - firstName
      - lastName
      - mobileNumber
      - role
    ClientSummaryResponse:
      type: object
      description: A client as shown in the client list
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
        email:
          type: string
          description: Contact email address
          example: rohan.mehta@example.com
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager who looks after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        managerName:
          type: string
          description: Full name of the manager who looks after the client
          example: Pranay Singhal
        discountPercent:
          type: number
          description: "Discount granted to the client, as a percentage"
          example: 10.0
        companyNames:
          type: array
          description: "Names of the companies the client holds, ordered by name"
          items:
            type: string
            example: Mehta Textiles Pvt Ltd
        totalPending:
          type: number
          description: "What the client still owes: everything billed to all of their\
            \ companies less every payment received, across all financial years. Negative\
            \ when they have paid more than billed"
          example: 19630.0
    ManagerResponse:
      type: object
      description: A manager held in the catalog
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the manager
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        firstName:
          type: string
          description: Given name of the manager
          example: Pranay
        lastName:
          type: string
          description: Family name of the manager
          example: Singhal
        email:
          type: string
          description: Work email address
          example: pranay.singhal@pranaysinghal.in
        role:
          type: string
          description: Seniority the manager holds
          enum:
          - SENIOR_MANAGER
          - MANAGER
          - ASSOCIATE
          example: SENIOR_MANAGER
        mobileNumber:
          type: string
          description: Mobile contact number
          example: +91 98765 43210
        clientCount:
          type: integer
          format: int64
          description: Number of clients assigned to the manager. Returned when listing
            managers and when fetching one by id
          example: 12
        totalPending:
          type: number
          description: "What the manager's clients still owe: everything billed to\
            \ all of their companies less every payment received, across all financial\
            \ years. Negative when they have paid more than billed. Returned when\
            \ listing managers and when fetching one by id"
          example: 20630.0
        clients:
          type: array
          description: "Clients assigned to the manager, ordered by last name then\
            \ first name, as the client list shows them. Returned when fetching a\
            \ manager by id"
          items:
            $ref: "#/components/schemas/ClientSummaryResponse"
        createdAt:
          type: string
          format: date-time
          description: When the manager was added
          example: 2026-10-01T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the manager was last updated
          example: 2026-10-01T10:15:30Z
    ClientUpdateRequest:
      type: object
      description: "New content for a client, excluding their companies"
      properties:
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
          maxLength: 100
          minLength: 0
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
          maxLength: 20
          minLength: 0
          pattern: "^[+]?[0-9 ()-]{6,20}$"
        email:
          type: string
          format: email
          description: Contact email address
          example: rohan.mehta@example.com
          maxLength: 254
          minLength: 0
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager from the Manager Catalog who looks
            after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        discountPercent:
          type: number
          default: "0.00"
          description: "Discount granted to the client, as a percentage. Also applied\
            \ to every company that does not set its own"
          example: 10.0
          maximum: 100.00
          minimum: 0.00
      required:
      - email
      - firstName
      - lastName
      - managerId
      - phone
    ClientResponse:
      type: object
      description: A client held in the ledger
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
        email:
          type: string
          description: Contact email address
          example: rohan.mehta@example.com
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager who looks after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        managerName:
          type: string
          description: Full name of the manager who looks after the client
          example: Pranay Singhal
        discountPercent:
          type: number
          description: "Discount granted to the client, as a percentage"
          example: 10.0
        companies:
          type: array
          description: "Companies the client holds, ordered by name"
          items:
            $ref: "#/components/schemas/CompanyResponse"
        totalPending:
          type: number
          description: "What the client still owes: everything billed to all of their\
            \ companies less every payment received, across all financial years. Negative\
            \ when they have paid more than billed. Returned when fetching a client\
            \ by id"
          example: 19630.0
        createdAt:
          type: string
          format: date-time
          description: When the client was added
          example: 2026-10-04T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the client was last updated
          example: 2026-10-04T10:15:30Z
    CompanyResponse:
      type: object
      description: A company held against a client
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the company
          example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
        companyName:
          type: string
          description: Registered name of the company
          example: Mehta Textiles Pvt Ltd
        companyType:
          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
        address:
          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage:\
            \ the company's own, or the client's current discount when the company\
            \ has none of its own"
          example: 5.0
        discountInherited:
          type: boolean
          description: "True when the company has no discount of its own, so discountPercent\
            \ is the client's and follows any change to it"
          example: false
        serviceCount:
          type: integer
          format: int64
          description: Number of services assigned to the company. Only returned when
            listing a client's companies
          example: 3
        financialYear:
          type: string
          description: Financial year the billing figures below cover. Only returned
            when listing a client's companies for a financial year
          example: 2026-27
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the financial year:\
            \ taxable amounts plus GST. Only returned when listing for a financial\
            \ year"
          example: 39235.0
        totalPaymentReceived:
          type: number
          description: "Sum of the payments received in the financial year, as a positive\
            \ number. Only returned when listing for a financial year"
          example: 15605.0
        pending:
          type: number
          description: Billed less received in the financial year; negative when more
            was received. Only returned when listing for a financial year
          example: 23630.0
    CompanyRequest:
      type: object
      description: "Company owned by, or acted for on behalf of, the client"
      properties:
        companyName:
          type: string
          description: Registered name of the company
          example: Mehta Textiles Pvt Ltd
          maxLength: 200
          minLength: 0
        companyType:
          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
        address:
          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
          maxLength: 500
          minLength: 0
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage.\
            \ When omitted, the company takes the client's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
      required:
      - address
      - companyName
      - companyType
    ServiceAssignmentUpdateRequest:
      type: object
      description: New details for a service assigned to a company
      properties:
        deliveryDate:
          type: string
          format: date
          description: "Date the service is, or was, delivered"
          example: 2026-10-15
        discountPercent:
          type: number
          description: "Discount granted on this service, as a percentage. When omitted,\
            \ the service takes the company's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        comment:
          type: string
          description: "Free-text note about this delivery. When omitted, any existing\
            \ comment is cleared"
          example: Filing for September 2026
          maxLength: 1000
          minLength: 0
      required:
      - deliveryDate
    ServiceAssignmentResponse:
      type: object
      description: A catalog service assigned to a company
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of this assignment
          example: 9d2a7c40-6e1b-4f53-b8a9-0c3e5d7f1a62
        clientId:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        companyId:
          type: string
          format: uuid
          description: Identifier of the company the service is delivered to
          example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
        serviceId:
          type: string
          format: uuid
          description: Identifier of the service in the Service Catalog
          example: 3b8e5f21-9c4d-4a17-8e62-1f0d7a9c5b34
        serviceName:
          type: string
          description: Name of the service in the Service Catalog
          example: GST Monthly Return Filing
        serviceType:
          type: string
          description: "How the service is billed, taken from the Service Catalog"
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        serviceFee:
          type: number
          description: "Standard fee of the service, excluding GST and before this\
            \ assignment's discount, taken from the Service Catalog"
          example: 5000.0
        gstRatePercent:
          type: number
          description: "GST rate applied to the service fee, as a percentage, taken\
            \ from the Service Catalog"
          example: 18.0
        deliveryDate:
          type: string
          format: date
          description: "Date the service is, or was, delivered"
          example: 2026-10-15
        nextDueDate:
          type: string
          format: date
          description: "First date the service's invoice schedule falls on, on or\
            \ after the delivery date. A ONE_OFF service is due on its delivery date"
          example: 2026-11-07
        discountPercent:
          type: number
          description: "Discount granted on this service, as a percentage"
          example: 5.0
        comment:
          type: string
          description: "Free-text note about this delivery, absent when none was given"
          example: Filing for September 2026
        financialYear:
          type: string
          description: Financial year totalBilled covers. Only returned when listing
            a company's services for a financial year
          example: 2026-27
        totalBilled:
          type: number
          description: "Sum of this service's charges falling due in the financial\
            \ year: taxable amounts plus GST; zero when nothing fell due. Only returned\
            \ when listing for a financial year"
          example: 11210.0
        createdAt:
          type: string
          format: date-time
          description: When the service was assigned
          example: 2026-10-04T10:15:30Z
        updatedAt:
          type: string
          format: date-time
          description: When the assignment was last updated
          example: 2026-10-04T10:15:30Z
    PaymentRequest:
      type: object
      description: A payment received from a company
      properties:
        amountReceived:
          type: number
          description: "Amount received, as a positive number. The ledger stores it\
            \ as negative, against the charges it settles"
          example: 28025.0
          minimum: 0.01
        dateReceived:
          type: string
          format: date
          description: Date the payment was received; not after today
          example: 2026-10-12
        method:
          type: string
          description: How the payment was received
          enum:
          - BANK_TRANSFER
          - UPI
          - CHEQUE
          - CASH
          example: BANK_TRANSFER
        reference:
          type: string
          description: "The payer's reference, such as a UTR, UPI transaction id or\
            \ cheque number"
          example: HDFC0001234567890
          maxLength: 100
          minLength: 0
        comment:
          type: string
          description: Free-text note about the payment
          example: Settles the incorporation invoice
          maxLength: 1000
          minLength: 0
      required:
      - amountReceived
      - dateReceived
      - method
    LedgerEntryResponse:
      type: object
      description: "A charge for a service that fell due, or a payment received. entryType\
        \ tells them apart; fields that do not apply to the type are left out"
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the ledger entry
          example: 5e7c1a93-2b4d-4f86-9a0e-8d3b6c2f1e47
        clientId:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        companyId:
          type: string
          format: uuid
          description: Identifier of the company billed
          example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
        entryType:
          type: string
          description: "SERVICE_CHARGE for an amount owed for a service, PAYMENT for\
            \ an amount received"
          enum:
          - SERVICE_CHARGE
          - PAYMENT
          example: SERVICE_CHARGE
        companyServiceId:
          type: string
          format: uuid
          description: Identifier of the service as assigned to the company
          example: 9d2a7c40-6e1b-4f53-b8a9-0c3e5d7f1a62
        serviceId:
          type: string
          format: uuid
          description: Identifier of the service in the Service Catalog
          example: 3b8e5f21-9c4d-4a17-8e62-1f0d7a9c5b34
        serviceName:
          type: string
          description: Name of the service when the entry was posted
          example: GST Monthly Return Filing
        serviceType:
          type: string
          description: How the service is billed
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        dueDate:
          type: string
          format: date
          description: "For a service charge, the date the service fell due, which\
            \ it bills; for a payment, the date it was received"
          example: 2026-10-07
        financialYear:
          type: string
          description: Indian financial year (1 April to 31 March) the due date falls
            in
          example: 2026-27
        entryDate:
          type: string
          format: date
          description: Date the entry was posted to the ledger
          example: 2026-10-13
        serviceFee:
          type: number
          description: "Standard fee of the service, before discount and excluding\
            \ GST"
          example: 5000.0
        discountPercent:
          type: number
          description: "Discount granted on the service, as a percentage"
          example: 5.0
        discountAmount:
          type: number
          description: Amount taken off the service fee by the discount
          example: 250.0
        taxableAmount:
          type: number
          description: "Service fee after discount, on which GST is charged"
          example: 4750.0
        gstRatePercent:
          type: number
          description: "GST rate applied, as a percentage"
          example: 18.0
        gstAmount:
          type: number
          description: GST charged on the taxable amount
          example: 855.0
        totalAmount:
          type: number
          description: "For a service charge, the amount owed: the taxable amount\
            \ plus GST. For a payment, the amount received as a negative number"
          example: 5605.0
        paymentMethod:
          type: string
          description: How a payment was received
          enum:
          - BANK_TRANSFER
          - UPI
          - CHEQUE
          - CASH
          example: BANK_TRANSFER
        paymentReference:
          type: string
          description: "The payer's reference for a payment, such as a UTR or cheque\
            \ number"
          example: HDFC0001234567890
        comment:
          type: string
          description: Free-text note about a payment
          example: Settles the incorporation invoice
        createdAt:
          type: string
          format: date-time
          description: When the entry was posted
          example: 2026-10-13T04:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: When the entry was last changed; its posting time until its
            rates are corrected
          example: 2026-10-13T04:30:00Z
    LedgerEntryUpdateRequest:
      type: object
