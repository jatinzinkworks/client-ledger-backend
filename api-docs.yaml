          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: financialYear
        in: query
        description: "Indian financial year to export, written as yyyy-yy"
        required: true
        schema:
          type: string
        example: 2026-27
      responses:
        "200":
          description: "The workbook, as an attachment; a year with no entries gives\
