      responses:
        "200":
          description: Existing firm details updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmDetailsResponse"
        "201":
          description: Firm details created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmDetailsResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A concurrent save conflicted; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients:
    get:
      tags:
      - Clients
      summary: List clients
      description: "Returns every client, or only the clients of one manager when\
        \ managerId is given, ordered by last name then first name. Each entry names\
        \ the client's companies only; fetch a client by id for the full company details.\
        \ Each entry also carries what the client still owes (totalPending): everything\
        \ billed to all of their companies less every payment received, across all\
        \ financial years. The list is returned whole; it is not paged."
      operationId: listClients
      parameters:
      - name: managerId
        in: query
        description: Only return clients assigned to this manager. Omit to return
          every client. An unknown manager returns an empty list
        required: false
        schema:
          type: string
          format: uuid
        example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
      responses:
        "200":
          description: "The matching clients, empty when there are none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummaryResponse"
        "400":
          description: managerId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Clients
      summary: Create a client
      description: "Adds a client together with the companies they hold. Every field\
        \ is mandatory, at least one company must be supplied, and the assigned manager\
        \ must already exist in the Manager Catalog."
      operationId: createClient
      requestBody:
        description: "Client to add, with their companies"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
        required: true
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "400":
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The assigned manager does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{id}/companies:
    get:
      tags:
      - Client Companies
      summary: List the companies of a client
      description: "Returns every company the client holds, in full, ordered by company\
        \ name, each with the number of services assigned to it. Given a financialYear,\
        \ each company also carries what it was billed (totalBilled), what it paid\
        \ (totalPaymentReceived) and what is pending in that year, from the ledger:\
        \ charges count in the year they fell due and payments in the year they were\
        \ received, and a company with no activity in the year shows zeros. Without\
        \ one, those fields are left out."
