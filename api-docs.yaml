  /psc/cl/v1/clients/next-client-id:
    get:
      tags:
      - Clients
      summary: Get the next free client id
      description: "Returns the client id to give the next client added: the highest\
        \ client id held plus one, as PSC-00042, or PSC-00001 when there are no clients.\
        \ The id is not reserved: if another client is added under it first, creating\
        \ a client with it returns 409, and this endpoint can be asked again."
      operationId: nextClientId
      responses:
        "200":
          description: The next free client id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextClientIdResponse"
        "409":
          description: The highest client id held is already PSC-99999
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/import/template:
    get:
      tags:
      - Clients
      summary: Download the client import template
      description: "Returns the Excel workbook to fill in for POST /clients/import.\
        \ Its Clients sheet takes one row per client: Client ID, First Name, Last\
        \ Name, Phone, Email, Manager Name, Discount % and Birthday. Its Companies\
        \ sheet takes one row per company: Client ID, Company Name, Company Type,\
        \ Address, Discount %, Opening Balance and Opening Balance Date, linked to\
        \ its client by the Client ID. An Instructions sheet describes every column\
        \ with an example. Only clients and their companies are imported; services\
        \ are assigned afterwards as usual."
      operationId: downloadTemplate_1
      responses:
        "200":
          description: "The template, as an attachment"
          headers:
            Content-Disposition:
              description: "attachment, with the template's file name"
              style: simple
              schema:
                type: string
                example: attachment; filename="Client_Import_Template.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/birthdays:
    get:
      tags:
      - Birthdays
      summary: List the clients with a birthday in a month
      description: "Returns every client whose birthday falls in the given month,\
        \ whatever the year they were born, ordered by day of the month, then first\
        \ and last name. Clients without a birthday recorded are left out. The list\
        \ is returned whole; it is not paged."
      operationId: listBirthdays
      parameters:
      - name: month
        in: query
        description: "Month of the year, 1 for January to 12 for December"
        required: true
        schema:
          type: integer
          maximum: 12
          minimum: 1
        example: 7
      responses:
        "200":
          description: "The clients with a birthday in the month, empty when there\
            \ are none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientBirthdayResponse"
        "400":
          description: "month is missing, not a whole number, or not between 1 and\
            \ 12"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CatalogServiceRequest:
      type: object
      description: Service to add to the catalog
      properties:
        serviceName:
          type: string
          description: "Name of the service, unique across the catalog"
          example: GST Monthly Return Filing
          maxLength: 150
          minLength: 0
        description:
          type: string
          description: What the service covers
          example: Preparation and filing of GSTR-1 and GSTR-3B each month
          maxLength: 1000
          minLength: 0
        category:
          type: string
          description: Practice area the service belongs to
          enum:
          - COMPLIANCE
          - TAX
          - AUDIT
          - ACCOUNTING
          - ADVISORY
          - CERTIFICATION
          example: COMPLIANCE
        billingFrequency:
          type: string
          description: How often the service is billed
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        standardFee:
          type: number
          description: "Standard fee charged for the service, excluding GST"
          example: 5000.0
          minimum: 0.00
        gstRatePercent:
          type: number
          default: "18.00"
          description: "GST rate applied to the fee, as a percentage"
          example: 18.0
          maximum: 100.00
          minimum: 0.00
        invoiceSchedule:
          $ref: "#/components/schemas/InvoiceSchedule"
          description: When invoices are raised. Omit entirely for ONE_OFF billing
      required:
      - billingFrequency
      - category
      - serviceName
      - standardFee
    InvoiceSchedule:
      type: object
      description: When invoices are raised for a recurring service
      properties:
        dayOfMonth:
          type: integer
          format: int32
          description: "Day of the month the invoice is raised. In months shorter\
            \ than this day, the invoice falls on the last day of that month instead"
          example: 7
          maximum: 31
          minimum: 1
        monthOfQuarter:
          type: string
          description: "Quarterly billing only: which month after the quarter closes\
            \ the invoice is raised in"
          enum:
          - FIRST_MONTH
          - SECOND_MONTH
          - THIRD_MONTH
          example: FIRST_MONTH
        month:
          type: string
          description: "Annual billing only: the month the invoice is raised in, by\
            \ name"
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          example: APRIL
    CatalogServiceResponse:
      type: object
      description: A service held in the catalog
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the service
          example: b41e7a52-9c3d-4f16-8ad0-5e2b9c7f1d38
        serviceName:
          type: string
          description: Name of the service
          example: GST Monthly Return Filing
        description:
          type: string
          description: What the service covers
          example: Preparation and filing of GSTR-1 and GSTR-3B each month
        category:
          type: string
          description: Practice area the service belongs to
          enum:
          - COMPLIANCE
          - TAX
          - AUDIT
          - ACCOUNTING
          - ADVISORY
          - CERTIFICATION
          example: COMPLIANCE
        billingFrequency:
          type: string
          description: How often the service is billed
          enum:
          - ONE_OFF
          - MONTHLY
          - QUARTERLY
          - ANNUAL
          example: MONTHLY
        standardFee:
          type: number
          description: "Standard fee charged for the service, excluding GST"
          example: 5000.0
        gstRatePercent:
          type: number
          description: "GST rate applied to the fee, as a percentage"
          example: 18.0
        invoiceSchedule:
          $ref: "#/components/schemas/InvoiceSchedule"
          description: When invoices are raised. Absent for ONE_OFF billing
        usedByCompanies:
          type: integer
          format: int32
          description: How many companies currently subscribe to this service. Read
            only
          example: 12
          readOnly: true
        financialYear:
          type: string
          description: Financial year totalBilled covers. Only returned when listing
            the catalog for a financial year; absent when totalBilled covers every
            year to date
          example: 2026-27
          readOnly: true
        totalBilled:
          type: number
          description: "Sum of this service's charges across every client, taxable\
            \ amounts plus GST: those falling due in financialYear when listing for\
            \ one, otherwise every charge due to date. Zero when nothing fell due.\
