        "404":
          description: "No client carries this identifier, the client holds no such\
            \ company, or the service does not exist in the Service Catalog"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /psc/cl/v1/clients/{clientId}/companies/{companyId}/payments:
    get:
      tags:
      - Ledger
      summary: List the payments received from a company
      description: "Returns the payments recorded for one company of the client, a\
        \ page at a time, earliest received first unless sortBy and sortDirection\
        \ choose another order. Each is the ledger entry it was recorded as: entryType\
        \ PAYMENT, totalAmount negative, and dueDate the date received. fromDate,\
        \ toDate and financialYear filter on the date received, either end of the\
        \ range may be left open, and given together only payments matching both are\
        \ returned. Sorting by totalAmount ascending puts the largest payment first,\
        \ as amounts are stored as negative. The summary counts and totals every matching\
        \ payment across all pages."
      operationId: listPayments
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      - name: fromDate
        in: query
        description: Only return entries due on or after this date (ISO yyyy-MM-dd).
          Omit to leave the range open at the start
        required: false
        schema:
          type: string
          format: date
        example: 2026-04-01
      - name: toDate
        in: query
        description: Only return entries due on or before this date (ISO yyyy-MM-dd).
          Omit to leave the range open at the end
        required: false
        schema:
          type: string
          format: date
        example: 2027-03-31
      - name: financialYear
        in: query
        description: "Only return entries whose due date falls in this Indian financial\
          \ year (1 April to 31 March), written as yyyy-yy. Omit to return entries\
          \ of every year"
        required: false
        schema:
          type: string
        example: 2026-27
      - name: page
        in: query
        description: "Page to return, counting from 0. A page past the last returns\
          \ no entries"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: "Largest number of entries a page holds, from 1 to 200"
        required: false
        schema:
          type: integer
          format: int32
          default: 50
        example: 50
      - name: sortBy
        in: query
        description: "Field to sort entries by: dueDate, entryDate, serviceName or\
          \ totalAmount. Entries alike in that field follow in due date, then service\
          \ name, order, which keeps pages stable"
        required: false
        schema:
          type: string
          default: dueDate
          enum:
          - dueDate
          - entryDate
          - serviceName
          - totalAmount
      - name: sortDirection
        in: query
        description: Whether sortBy ascends (asc) or descends (desc); either case
          is accepted
        required: false
        schema:
          type: string
          default: asc
          enum:
          - asc
          - desc
      responses:
        "200":
          description: "A page of the company's payments, with the totals of every\
            \ matching payment; no payments and zero totals when none matches"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentListResponse"
        "400":
          description: "An identifier is not a valid UUID, a date is not a valid ISO\
            \ date, fromDate is after toDate, financialYear is not a year such as\
            \ 2026-27, page is negative, size is outside 1 to 200, or sortBy or sortDirection\
            \ is not one of the values listed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Ledger
      summary: Record a payment received from a company
      description: "Records a payment received from one company of the client as an\
        \ entry in its ledger, with entryType PAYMENT. The amount is given as a positive\
        \ number and stored as negative, so the ledger's totals add up to what is\
        \ still owed. The date received places the payment in the ledger: it is the\
        \ entry's dueDate, decides its financial year, and cannot be after today.\
        \ The payment is not matched to particular service charges; it reduces the\
        \ company's balance as a whole."
      operationId: recordPayment
      parameters:
      - name: clientId
        in: path
        description: Identifier of the client
        required: true
        schema:
          type: string
          format: uuid
        example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
      - name: companyId
        in: path
        description: Identifier of the company that paid
        required: true
        schema:
          type: string
          format: uuid
        example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
      requestBody:
        description: The payment received
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
        required: true
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntryResponse"
        "400":
          description: "Request body failed validation, dateReceived is after today,\
            \ or an identifier is not a valid UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No client carries this identifier, or the client holds no\
            \ such company"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
