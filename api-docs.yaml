          type: integer
          format: int64
          description: Number of entries listed in this financial year
          example: 7
        totalServiceFee:
          type: number
          description: "Sum of the service fees, before discount and excluding GST"
          example: 35000.0
        totalDiscountAmount:
          type: number
          description: Sum of the discounts taken off the service fees
          example: 1750.0
        totalTaxableAmount:
          type: number
          description: "Sum of the taxable amounts, on which GST is charged"
          example: 33250.0
        totalGstAmount:
          type: number
          description: Sum of the GST charged
          example: 5985.0
        totalAmount:
          type: number
          description: "Sum of the amounts charged for services: taxable amounts plus\
            \ GST. Payments and opening balances are not included; see totalPaid and\
            \ openingBalance"
          example: 39235.0
        openingBalance:
          type: number
          description: "Sum of the opening balances dated in this financial year:\
            \ positive when owed, negative when in credit"
          example: 0.0
        totalPaid:
          type: number
          description: "Sum of the payments received, as a positive number"
          example: 28025.0
        balance:
          type: number
          description: "Amount still owed: totalAmount plus openingBalance less totalPaid;\
            \ negative when in credit"
          example: 11210.0
    LedgerListResponse:
      type: object
      description: "One page of ledger entries, with the totals of every entry matching\
        \ the filters"
      properties:
        entries:
          type: array
          description: "The entries on this page, earliest due first; empty when none\
            \ matches or the page is past the last"
          items:
            $ref: "#/components/schemas/LedgerEntryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
          description: Position of this page within every entry matching the filters
        summary:
          $ref: "#/components/schemas/LedgerSummary"
          description: "Totals of every entry matching the filters, across all pages"
    LedgerSummary:
      type: object
      description: "Totals of every ledger entry matching the filters, across all\
        \ pages, not just the page returned"
      properties:
        entryCount:
          type: integer
          format: int64
          description: "Number of entries matching the filters, service charges, payments\
            \ and opening balances alike"
          example: 12
        totalServiceFee:
          type: number
          description: "Sum of the service fees, before discount and excluding GST;\
            \ service charges only"
          example: 60000.0
        totalDiscountAmount:
          type: number
          description: Sum of the discounts taken off the service fees
          example: 3000.0
        totalTaxableAmount:
          type: number
          description: "Sum of the taxable amounts, on which GST is charged"
          example: 57000.0
        totalGstAmount:
          type: number
          description: Sum of the GST charged
          example: 10260.0
        totalAmount:
          type: number
          description: "Sum of the amounts charged for services: taxable amounts plus\
            \ GST. Payments and opening balances are not included; see totalPaid and\
            \ openingBalance"
          example: 67260.0
        openingBalance:
          type: number
          description: "Sum of the opening balances companies were taken on with:\
            \ positive when owed, negative when in credit; zero when there are none"
          example: 0.0
        totalPaid:
          type: number
          description: "Sum of the payments received, as a positive number"
          example: 28025.0
        balance:
          type: number
          description: "Amount still owed: totalAmount plus openingBalance less totalPaid;\
            \ negative when in credit"
          example: 39235.0
        byFinancialYear:
          type: array
          description: "The same totals for each financial year the entries fall in,\
            \ earliest year first; empty when there are no entries"
          items:
            $ref: "#/components/schemas/FinancialYearTotals"
        byCompany:
          type: array
          description: "The same totals for each company the entries were billed to,\
            \ ordered by company name. Returned on the client's ledger only; empty\
            \ when there are no entries"
          items:
            $ref: "#/components/schemas/CompanyTotals"
    PageMetadata:
      type: object
      description: Position of the page returned within the full list
      properties:
        number:
          type: integer
          format: int32
          description: "Number of this page, counting from 0"
          example: 0
        size:
          type: integer
          format: int32
          description: Largest number of entries a page holds
          example: 50
        numberOfElements:
          type: integer
          format: int32
          description: Number of entries on this page
          example: 50
        totalElements:
          type: integer
          format: int64
          description: Number of entries across every page
          example: 132
        totalPages:
          type: integer
          format: int32
          description: Number of pages; 0 when there are no entries
          example: 3
        hasNext:
          type: boolean
          description: Whether a page follows this one
          example: true
    PaymentListResponse:
      type: object
      description: "One page of a company's payments, with the totals of every payment\
        \ matching the filters"
      properties:
        payments:
          type: array
          description: "The payments on this page, each the ledger entry it was recorded\
            \ as, with entryType PAYMENT and a negative totalAmount; empty when none\
            \ matches or the page is past the last"
          items:
            $ref: "#/components/schemas/LedgerEntryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
          description: Position of this page within every payment matching the filters
        summary:
          $ref: "#/components/schemas/PaymentSummary"
          description: "Totals of every payment matching the filters, across all pages"
    PaymentSummary:
      type: object
      description: "Totals of every payment matching the filters, across all pages,\
        \ not just the page returned"
      properties:
        paymentCount:
          type: integer
          format: int64
          description: Number of payments matching the filters
          example: 4
        totalReceived:
          type: number
          description: "Sum of the payments received, as a positive number"
          example: 18605.0
    CompanyLedgerSummaryResponse:
      type: object
      description: A company's billing and payments for one Indian financial year
      properties:
        clientId:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        companyId:
          type: string
          format: uuid
          description: Identifier of the company
          example: 4c1f8a52-2d6b-4e93-b7a0-9e5d3c1f6a28
        companyName:
          type: string
          description: Name of the company
          example: Mehta Textiles Pvt Ltd
        financialYear:
          type: string
          description: Indian financial year summarised
          example: 2026-27
        fromDate:
          type: string
          format: date
          description: "First day of the financial year, 1 April"
          example: 2026-04-01
        toDate:
          type: string
          format: date
          description: "Last day of the financial year, 31 March"
          example: 2027-03-31
        totalBilled:
          type: number
          description: "Sum of the service charges falling due in the year: taxable\
            \ amounts plus GST"
          example: 39235.0
        openingBalance:
          type: number
          description: "The opening balance the company was taken on with, when dated\
            \ in the year: positive when owed, negative when in credit; zero otherwise.\
            \ Not part of totalBilled"
          example: 0.0
        totalPaymentReceived:
          type: number
          description: "Sum of the payments received in the year, as a positive number"
          example: 15000.0
        pending:
          type: number
          description: "Billed plus opening balance less received in the year; negative\
            \ when the year's payments exceed them, for example when they settle an\
            \ earlier year's charges"
          example: 24235.0
        totalDiscount:
          type: number
          description: Sum of the discounts taken off the service fees billed in the
            year
          example: 1750.0
        lastPayment:
          $ref: "#/components/schemas/LastPayment"
          description: The most recent payment received in the year; absent when none
            was received
    NextClientIdResponse:
      type: object
      description: The next free client id
      properties:
        clientId:
          type: string
          description: "One above the highest client id held, or PSC-00001 when there\
            \ are no clients"
          example: PSC-00042
    ClientBirthdayResponse:
      type: object
      description: A client's birthday
      properties:
        clientId:
          type: string
          format: uuid
          description: Identifier of the client
          example: 7a3d9e10-5b2c-4f81-a6e4-2c8b1d0f9e35
        firstName:
          type: string
          description: Given name of the client
          example: Rohan
        lastName:
          type: string
          description: Family name of the client
          example: Mehta
        birthday:
          type: string
          format: date
          description: Date of birth of the client
          example: 1985-07-23
        dayOfMonth:
          type: integer
          format: int32
          description: Day of the month the birthday falls on
          example: 23
        phone:
          type: string
          description: Contact phone number
          example: +91 98200 12345
        email:
          type: string
          description: Contact email address
          example: rohan.mehta@example.com
        managerId:
          type: string
          format: uuid
          description: Identifier of the manager who looks after the client
          example: e9b2c4d1-7f35-4a68-91c0-3d8a5e2f6b47
        managerName:
          type: string
          description: Full name of the manager who looks after the client
          example: Pranay Singhal
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT bearer token. Supply the raw token — the 'Bearer ' prefix is
        added for you.
      in: header
      scheme: bearer
      bearerFormat: JWT
