          type: string
          description: Legal form of the company
          enum:
          - PRIVATE_LIMITED
          - PUBLIC_LIMITED
          - LLP
          - PARTNERSHIP
          - PROPRIETORSHIP
          - TRUST
          - HUF
          - INDIVIDUAL
          example: PRIVATE_LIMITED
