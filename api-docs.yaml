          type: string
          description: Registered address of the company
          example: "12 MG Road, Bengaluru, Karnataka 560001"
        discountPercent:
          type: number
          description: "Discount granted on this company's work, as a percentage:\
            \ the company's own, or the client's current discount when the company\
            \ has none of its own"
          example: 5.0
        discountInherited:
          type: boolean
          description: "True when the company has no discount of its own, so discountPercent\
            \ is the client's and follows any change to it"
          example: false
        openingBalanceAmount:
          type: number
          description: "The balance the company was taken on with, brought over from\
            \ before: positive when owed, negative when in credit. Left out when the\
            \ company has none. Unlike openingBalance, returned whatever its financial\
            \ year"
          example: 25000.0
        openingBalanceDate:
          type: string
          format: date
          description: "The date the opening balance stood at, which places it in\
            \ a financial year. Left out when the company has none"
          example: 2026-03-31
