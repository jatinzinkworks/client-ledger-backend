        discountPercent:
          type: number
          description: "Discount granted on this service, as a percentage. When omitted,\
            \ the service takes the company's discount"
          example: 5.0
          maximum: 100.00
          minimum: 0.00
        comment:
          type: string
          description: Free-text note about this delivery
          example: Filing for September 2026
          maxLength: 1000
          minLength: 0
      required:
      - deliveryDate
      - serviceId
    ClientImportResponse:
